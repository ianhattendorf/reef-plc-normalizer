  - kind: gmp40
    source_topic: plc/aquarium/gmp40_1
    state_topic: reef/plc/state/gmp40_1
    raw_command_topic: plc/aquarium/command/gmp40_1
    fields:
      - source: GMP40_1_Data.Status.Valid
        length: 1
        value_type: bool
        discovery: {domain: binary_sensor, name: GMP40 1 Status Valid, entity_category: diagnostic}
      - source: GMP40_1_Data.Status.Available
        length: 1
        value_type: bool
        discovery: {domain: binary_sensor, name: GMP40 1 Available, device_class: connectivity}
      - source: GMP40_1_Data.Status.Power
        length: 1
        value_type: bool
        discovery:
          domain: switch
          name: GMP40 1 Power
          component_id: gmp40_1_power
          command_topic: reef/plc/command/gmp40_1/power
          command_mask: 1
          min: 0
          max: 1
      - source: GMP40_1_Data.Status.Mode
        length: 1
        value_type: hex_int
        discovery:
          domain: select
          name: GMP40 1 Mode
          component_id: gmp40_1_mode
          command_topic: reef/plc/command/gmp40_1/mode
          command_mask: 2
          min: 0
          max: 8
          options:
            - pulse_wave
            - sine_wave
            - constant_flow
            - random_wave
            - tide
            - nutrient_transport
            - circulation
            - feeding
            - custom_wave
          value_map:
            pulse_wave: 0
            sine_wave: 1
            constant_flow: 2
            random_wave: 3
            tide: 4
            nutrient_transport: 5
            circulation: 6
            feeding: 7
            custom_wave: 8
      - source: GMP40_1_Data.Status.Flow
        length: 3
        value_type: hex_int
        discovery:
          domain: number
          name: GMP40 1 Flow
          component_id: gmp40_1_flow
          command_topic: reef/plc/command/gmp40_1/flow
          command_mask: 4
          min: 0
          max: 100
          unit_of_measurement: "%"
      - source: GMP40_1_Data.Status.Frequency
        length: 3
        value_type: hex_int
        discovery:
          domain: number
          name: GMP40 1 Frequency
          component_id: gmp40_1_frequency
          command_topic: reef/plc/command/gmp40_1/frequency
          command_mask: 8
          min: 0
          max: 100
          unit_of_measurement: "%"
      - source: GMP40_1_Data.Status.CustomFrequency
        length: 3
        value_type: hex_int
        discovery: {domain: sensor, name: GMP40 1 Custom Frequency, unit_of_measurement: "%", entity_category: diagnostic}
      - source: GMP40_1_Data.Status.FeedTime
        length: 2
        value_type: hex_int
        discovery:
          domain: number
          name: GMP40 1 Feed Time
          component_id: gmp40_1_feed_time
          command_topic: reef/plc/command/gmp40_1/feed_time
          command_mask: 16
          min: 1
          max: 60
          unit_of_measurement: min
      - source: GMP40_1_Data.Status.FaultMask
        length: 3
        value_type: hex_int
